<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Consulta do Clima</title>


    <!-- CSS -->

    <link rel="stylesheet" href="./style.css">


    <!-- PWA -->

    <link rel="manifest" href="./manifest.json">

    <meta
        name="theme-color"
        content="#1f5c99"
    >


    <!-- ÍCONES DO APP -->

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icons/rainy-day.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="512x512"
        href="./icons/weather.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icons/rainy-day.png"
    >


    <!-- COMPATIBILIDADE MOBILE -->

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

</head>


<body>

    <main class="container">

        <div class="card">

            <div
                id="offlineAviso"
                class="offline"
            >
                🔴 Você está sem conexão.<br>
                Algumas funções podem não funcionar.
            </div>


            <h1>
                Consulta do Clima
            </h1>


            <label for="cidade">
                Digite uma cidade:
            </label>

            <input
                type="text"
                id="cidade"
                placeholder="Ex.: Lages"
                autocomplete="off"
            >


            <button
                id="buscar"
                type="button"
            >
                Buscar clima
            </button>


            <button
                id="instalarBtn"
                type="button"
                class="btn-instalar"
                hidden
            >
                📲 Instalar App
            </button>


            <section id="resultado"></section>

        </div>

    </main>


    <script src="./script.js"></script>

</body>

</html>
